[project]
name = "shared-goals-skill-dev"
version = "0.1.0"
description = "Shared Goals Hermes skill scripts"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["shared-goals/scripts"]
python_files = ["test_*.py"]
addopts = "-q -m 'not live'"
markers = ["live: touches real services or area scripts; run with -m live"]

[tool.ruff]
line-length = 120
# Area scripts and daily_compass_shared.py may run under macOS system python3 (3.9).
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
